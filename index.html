<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wedding Invitation</title>
<meta name="description" content="A wedding invitation" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ENVELOPE LANDING GATE — click/tap the envelope to reveal the card -->
  <div class="envelope-gate" id="envelopeGate">
    <div class="envelope-gate-inner">
      <img class="deity-image" id="deityImage" alt="" />
      <p class="envelope-hint">You're Invited</p>
      <button type="button" class="envelope" id="envelopeBtn" aria-label="Open the invitation">
        <span class="envelope-back"></span>
        <span class="envelope-letter">
          <span class="envelope-monogram" id="envelopeMonogram"></span>
          <span class="envelope-names" id="envelopeNames"></span>
        </span>
        <span class="envelope-flap">
          <span class="envelope-seal" id="envelopeSeal"></span>
        </span>
      </button>
      <p class="envelope-cta">Tap to open</p>
    </div>
  </div>

  <!-- floating petals / decoration layer -->
  <div class="petals" aria-hidden="true"></div>

  <!-- progress dots nav -->
  <nav class="dot-nav" id="dotNav" aria-label="Section navigation"></nav>

  <main>
    <!-- HERO -->
    <section class="section hero" id="hero">
      <div class="corner corner-tl" aria-hidden="true"></div>
      <div class="corner corner-tr" aria-hidden="true"></div>
      <div class="corner corner-bl" aria-hidden="true"></div>
      <div class="corner corner-br" aria-hidden="true"></div>

      <div class="deity-slot" id="deitySlot" aria-hidden="true"></div>

      <p class="invitation-line reveal" id="invitationLine"></p>

      <div class="couple-names reveal">
        <h1 class="name" id="groomName"></h1>
        <p class="parents" id="groomParents"></p>
        <div class="ampersand">&amp;</div>
        <h1 class="name" id="brideName"></h1>
        <p class="parents" id="brideParents"></p>
      </div>

      <img id="logoImg" class="logo-img" alt="Wedding logo" hidden />

      <div class="scroll-cue reveal" aria-hidden="true">
        <span></span>
        <small>Scroll</small>
      </div>
    </section>

    <!-- SAVE THE DATE -->
    <section class="section save-the-date" id="save-the-date">
      <p class="eyebrow reveal">Save the Dates</p>
      <h2 class="headline reveal" id="dateRange"></h2>
      <p class="venue-line reveal" id="venueLine"></p>

      <div class="countdown reveal" id="countdown" aria-live="polite">
        <div class="count-box"><span id="cdDays">00</span><small>Days</small></div>
        <div class="count-box"><span id="cdHours">00</span><small>Hours</small></div>
        <div class="count-box"><span id="cdMins">00</span><small>Minutes</small></div>
        <div class="count-box"><span id="cdSecs">00</span><small>Seconds</small></div>
      </div>

      <div class="hero-actions reveal">
        <a href="#" id="icsLink" class="btn btn-outline" download="wedding.ics">+ Add to Calendar</a>
      </div>
    </section>

    <!-- CELEBRATIONS -->
    <section class="section celebrations" id="celebrations">
      <p class="eyebrow reveal">Join Us For</p>
      <h2 class="headline reveal">The Celebrations</h2>
      <div class="events-grid" id="eventsGrid"></div>
    </section>

    <!-- VENUE & TRAVEL -->
    <section class="section venue" id="venue">
      <p class="eyebrow reveal">Where To Find Us</p>
      <h2 class="headline reveal">Venue &amp; Travel</h2>

      <div class="venue-card reveal">
        <h3 id="venueName"></h3>
        <p id="venueAddress"></p>
        <a id="mapLink" class="btn btn-outline" target="_blank" rel="noopener">Open in Google Maps</a>
      </div>

      <div class="map-embed reveal">
        <iframe
          id="mapEmbed"
          title="Venue map"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>

      <div class="travel-info reveal" id="travelInfo"></div>
    </section>

    <!-- CLOSING / RSVP -->
    <section class="section closing" id="closing">
      <p class="closing-message reveal" id="closingMessage"></p>

      <p class="footer-line reveal" id="footerLine"></p>

      <div class="rsvp-box reveal" id="rsvpBox">
        <p class="eyebrow">Kindly Respond</p>
        <h2 class="headline">RSVP</h2>
        <div id="rsvpContacts" class="rsvp-contacts"></div>

        <div class="google-form-embed" id="googleFormEmbed" hidden>
          <iframe
            id="googleFormIframe"
            title="RSVP form"
            loading="lazy"
          >Loading…</iframe>
        </div>

        <a id="googleFormLink" class="btn btn-outline" target="_blank" rel="noopener" hidden>
          Open RSVP Form
        </a>
        <a id="whatsappLink" class="btn btn-whatsapp" target="_blank" rel="noopener" hidden>
          RSVP on WhatsApp
        </a>
      </div>

      <div class="shlok reveal">
        <p class="sanskrit" id="shlokSanskrit"></p>
        <p class="meaning" id="shlokMeaning"></p>
      </div>
    </section>
  </main>

  <script src="wedding-data.js"></script>
  <script src="js/script.js" defer></script>
</body>
</html>
